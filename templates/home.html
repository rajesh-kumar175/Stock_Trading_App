<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stock Trading Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background: #0f1218; color: white; font-family: Arial, sans-serif; margin: 0; padding: 2rem; }
        .card { background: #1e2329; border-radius: 15px; padding: 20px; margin: 20px 0; }
        #stockChart { max-height: 420px; }
    </style>
</head>
<body>
    <h1>Stock Trading Dashboard</h1>
    <div class="card">
        <h2 id="stockName">AAPL</h2>
        <p id="stockPrice">Loading...</p>
        <p id="stockChange"></p>
        <canvas id="stockChart"></canvas>
    </div>
    <script>
        const symbol = new URLSearchParams(window.location.search).get('symbol') || 'AAPL';
        async function loadStockData() {
            const response = await fetch(`/api/stock?symbol=${encodeURIComponent(symbol)}`);
            if (!response.ok) throw new Error('Unable to load stock data');
            const data = await response.json();
            document.getElementById('stockName').textContent = data.name || symbol;
            document.getElementById('stockPrice').textContent = `$${Number(data.current_price).toFixed(2)}`;
            document.getElementById('stockChange').textContent = `${Number(data.change_percent) >= 0 ? '+' : ''}${Number(data.change_percent).toFixed(2)}%`;
            new Chart(document.getElementById('stockChart'), {
                type: 'line',
                data: {
                    labels: data.history.map(item => new Date(item.Date).toLocaleDateString()),
                    datasets: [{ label: 'Close Price', data: data.history.map(item => Number(item.Close)), borderColor: '#00c851', tension: 0.3 }]
                },
                options: { responsive: true, plugins: { legend: { display: false } } }
            });
        }
        loadStockData().catch(error => {
            console.error(error);
            document.getElementById('stockPrice').textContent = 'Unavailable';
        });
    </script>
</body>
</html>
