<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trading App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: #0f1218;
            color: white;
            font-family: Arial, sans-serif;
        }
        .card-dark {
            background: #1e2329;
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .stock-badge {
            background: rgba(0,200,81,0.12);
            color: #70f1a1;
            border-radius: 999px;
            padding: 6px 12px;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="container-fluid p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <div class="text-secondary">Market Overview</div>
                <div class="fs-3 fw-bold">Stock Trading Dashboard</div>
            </div>
            <a href="/login" class="btn btn-outline-light">Login</a>
        </div>

        <div class="row g-4">
            <div class="col-lg-4">
                <div class="card-dark">
                    <div class="text-secondary small">Selected Stock</div>
                    <div class="d-flex align-items-center justify-content-between mt-2">
                        <div>
                            <h3 class="mb-0" id="stockName">AAPL</h3>
                        </div>
                        <span class="stock-badge" id="stockChange">--</span>
                    </div>
                    <div class="fs-2 fw-bold mt-3" id="stockPrice">--</div>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="card-dark">
                    <h5 class="mb-3">Price Trend</h5>
                    <canvas id="stockChart" height="120"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        const stockSymbol = 'AAPL';

        async function loadStockData() {
            try {
                const response = await fetch('/api/stock/' + stockSymbol);
                if (!response.ok) {
                    throw new Error('Stock data unavailable');
                }

                const data = await response.json();
                const labels = data.history.map(item => {
                    const d = new Date(item.Date);
                    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                });
                const prices = data.history.map(item => Number(item.Close));

                document.getElementById('stockName').textContent = data.name || stockSymbol;
                document.getElementById('stockPrice').textContent = '$' + Number(data.current_price).toFixed(2);

                const change = Number(data.change_percent);
                const changeText = (change >= 0 ? '+' : '') + change.toFixed(2) + '%';
                const changeEl = document.getElementById('stockChange');
                changeEl.textContent = changeText;
                changeEl.style.background = change >= 0 ? 'rgba(0,200,81,0.12)' : 'rgba(255,99,71,0.12)';
                changeEl.style.color = change >= 0 ? '#70f1a1' : '#ff8a80';

                new Chart(document.getElementById('stockChart'), {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Close Price',
                            data: prices,
                            borderColor: '#00c851',
                            backgroundColor: 'rgba(0,200,81,0.15)',
                            fill: true,
                            tension: 0.3,
                            borderWidth: 2
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false }
                        },
                        scales: {
                            x: {
                                ticks: { color: '#cbd5e1' },
                                grid: { color: 'rgba(255,255,255,0.05)' }
                            },
                            y: {
                                ticks: { color: '#cbd5e1' },
                                grid: { color: 'rgba(255,255,255,0.05)' }
                            }
                        }
                    }
                });
            } catch (error) {
                console.error(error);
                document.getElementById('stockPrice').textContent = 'Unavailable';
                document.getElementById('stockChange').textContent = 'Error';
            }
        }

        loadStockData();
    </script>
</body>
</html>
