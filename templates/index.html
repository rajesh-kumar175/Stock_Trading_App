<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trading App</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>body{background:#0f1218;color:white}.card-dark{background:#1e2329;border-radius:15px;padding:20px;margin:20px 0}</style>
</head>
<body>
<div class="container-fluid p-4">
<div class="text-secondary">Your Balance</div>
<div class="fs-3 fw-bold mb-4">9.086 BTC <i class="fa fa-caret-up text-success"></i></div>
<div class="card-dark"><h5>Monthly Sales</h5><canvas id="salesChart"></canvas></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
fetch('/api/sales').then(r=>r.json()).then(d=>{
 new Chart(document.getElementById('salesChart'),{type:'line',data:{labels:d.map(x=>x.month),datasets:[{label:'Sales',data:d.map(x=>x.sales),borderColor:'#00c851',backgroundColor:'rgba(0,200,81,0.1)',fill:true,tension:0.4}]}});
});
</script>
</body>
</html>
